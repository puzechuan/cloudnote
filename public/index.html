<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#080808" media="(prefers-color-scheme: dark)">
  <title>cloudnote</title>
  <link rel="stylesheet" href="/css/app.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="signed-out">
  <header class="app-bar">
    <button class="menu-btn" id="menuBtn" type="button" aria-label="打开菜单" aria-expanded="false">
      <span class="line"></span>
    </button>
    <h1><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">cloudnote</span></h1>
    <div class="search" role="search">
      <i class="material-icons search-icon" aria-hidden="true">search</i>
      <input class="search-input" id="searchInput" type="search" name="q" placeholder="搜索标题或内容"
        autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="搜索笔记标题或内容"
        data-lpignore="true" data-1p-ignore>
      <kbd class="search-kbd" aria-hidden="true">Ctrl K</kbd>
      <button class="search-clear" id="searchClear" type="button" aria-label="清除搜索" hidden>
        <i class="material-icons">close</i>
      </button>
    </div>
    <a class="nav-link" id="myShareBtn" href="/myshare" aria-label="我的分享">
      <i class="material-icons" aria-hidden="true">link</i>
      <span class="nav-label">我的分享</span>
    </a>
    <div class="account-area" id="accountArea">
      <button class="account-btn" id="authBtn">登录/注册</button>
    </div>
  </header>
  
  <div class="overlay" id="sidebarOverlay"></div>
  
  <div class="main-container">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <strong id="listTitle">登录后查看笔记</strong>
        <div class="sidebar-actions" id="sidebarActions">
          <button class="btn" id="importBtn" type="button" aria-label="导入 TXT 文件" title="导入 TXT 文件（最大 1.5 MB）">
            <i class="material-icons">upload_file</i> <span class="btn-label">导入</span>
          </button>
          <button class="btn btn-primary" id="newBtn" type="button">
            <i class="material-icons">add</i> 新建
          </button>
        </div>
      </div>
      <div class="notebooks-list" id="list"></div>
    </div>
    
    <div class="editor-container" id="editorContainer">
      <div class="editor-toolbar">
        <input class="title-input" id="titleInput" placeholder="请点左侧笔记本或新建" disabled>
      </div>
      <div class="content-area">
        <textarea class="content-input" id="content" placeholder="请先在左侧选择或新建笔记" disabled></textarea>
        <span class="char-count" id="charCount" hidden>0 字</span>
      </div>
      <div class="editor-actions">
        <button class="btn btn-export" id="exportBtn" type="button" aria-label="导出为 TXT 文件" disabled>
          <i class="material-icons">file_download</i> 导出
        </button>
        <button class="btn" id="shareBtn">
          <i class="material-icons">share</i> 分享
        </button>
        <button class="btn btn-primary" id="saveBtn">
          <i class="material-icons">save</i> 保存
        </button>
      </div>
    </div>
  </div>
  
  <div class="account-menu" id="accountMenu">
    <div class="account-menu-item" id="changePwItem">
      <i class="material-icons">settings</i>
      <span>修改密码</span>
    </div>
    <div class="account-menu-item" id="mySharesItem">
      <i class="material-icons">link</i>
      <span>我的分享</span>
    </div>
    <div class="account-menu-item" id="adminPanelItem" hidden>
      <i class="material-icons">admin_panel_settings</i>
      <span>管理面板</span>
    </div>
    <div class="account-menu-divider"></div>
    <div class="account-menu-item" id="logoutItem">
      <i class="material-icons">exit_to_app</i>
      <span>退出</span>
    </div>
  </div>
  
  <div class="context-menu" id="notebookMenu" role="menu" aria-label="笔记操作" hidden>
    <button class="context-menu-item" type="button" role="menuitem" data-action="share">
      <i class="material-icons" aria-hidden="true">share</i><span>分享</span>
    </button>
    <button class="context-menu-item" type="button" role="menuitem" data-action="export">
      <i class="material-icons" aria-hidden="true">file_download</i><span>导出</span>
    </button>
    <div class="context-menu-divider" role="separator"></div>
    <button class="context-menu-item context-menu-danger" type="button" role="menuitem" data-action="delete">
      <i class="material-icons" aria-hidden="true">delete</i><span>删除</span>
    </button>
  </div>

  <div class="toast" id="toast"></div>

  <div class="context-menu" id="editorMenu" role="menu" aria-label="编辑操作" hidden>
    <button class="context-menu-item" type="button" role="menuitem" data-action="cut" disabled>
      <i class="material-icons" aria-hidden="true">content_cut</i><span>剪切</span>
    </button>
    <button class="context-menu-item" type="button" role="menuitem" data-action="copy" disabled>
      <i class="material-icons" aria-hidden="true">content_copy</i><span>复制</span>
    </button>
    <button class="context-menu-item" type="button" role="menuitem" data-action="paste">
      <i class="material-icons" aria-hidden="true">content_paste</i><span>粘贴</span>
    </button>
    <div class="context-menu-divider" role="separator"></div>
    <button class="context-menu-item" type="button" role="menuitem" data-action="select-all">
      <i class="material-icons" aria-hidden="true">select_all</i><span>全选</span>
    </button>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip" aria-hidden="true"></div>

  <input type="file" id="importInput" accept=".txt,text/plain" hidden>

  <script src="/js/app.js"></script>
</body>
</html>
